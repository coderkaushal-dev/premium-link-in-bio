<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Coder Kaushal">
    <title>Premium Link-in-Bio | Coder Kaushal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <main class="mobile-frame">
        
        <button class="share-btn" id="share-btn" title="Share Profile">
            🔗
        </button>
        <div class="toast-msg" id="toast-msg">Link Copied! ✅</div>

        <header class="profile-header">
            <div class="img-container">
                <img src="logo.png" alt="Coder Kaushal" class="profile-img" onerror="this.src='https://api.dicebear.com/7.x/initials/svg?seed=CK&backgroundColor=1a1d24'">
            </div>
            <h1 class="profile-name">Coder Kaushal <span class="verified">✔</span></h1>
            <p class="profile-bio">Full Stack Web & App Developer 🚀</p>
        </header>

        <section class="links-container" id="links-container">
            
            <a href="https://youtube.com/@coderkaushal" target="_blank" class="link-btn yt">
                <span class="icon">📺</span>
                <span class="text">Subscribe on YouTube</span>
            </a>

            <a href="https://instagram.com/coderkaushal" target="_blank" class="link-btn insta">
                <span class="icon">📸</span>
                <span class="text">Follow on Instagram</span>
            </a>

            <a href="https://facebook.com/coderkaushal" target="_blank" class="link-btn fb">
                <span class="icon">📘</span>
                <span class="text">Follow on Facebook</span>
            </a>

            <a href="https://github.com/coderkaushal-dev" target="_blank" class="link-btn github">
                <span class="icon">🐙</span>
                <span class="text">Check my GitHub</span>
            </a>

            <a href="https://t.me/coderkaushal" target="_blank" class="link-btn tg">
                <span class="icon">✈️</span>
                <span class="text">Join Telegram Community</span>
            </a>

            <a href="https://coderkaushal.netlify.app" target="_blank" class="link-btn website">
                <span class="icon">🌍</span>
                <span class="text">Visit Portfolio</span>
            </a>

        </section>

        <div class="ui-credit-inside">
            Coded with 💻 by <a href="https://coderkaushal.netlify.app" target="_blank">Coder Kaushal</a>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
